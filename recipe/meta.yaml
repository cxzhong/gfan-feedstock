{% set version = "0.7" %}
{% set name = "gfan" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  fn: {{ name }}{{ version }}.tar.gz
  url: http://home.math.au.dk/jensen/software/gfan/gfan{{ version }}.tar.gz
  sha256: ab833757e1e4d4a98662f4aa691394013ea9a226f6416b8f8565356d6fcc989e
  patches:
    # Patches taken from https://github.com/sagemath/sage
    - patches/nodel.patch  # [osx]
    # patch Makefile to use CXXFLAGS, LDFLAGS, etc.
    - patches/Makefile.patch
    # use std::pmr instead of std::experimental::pmr (libc++ compatibility)
    - patches/pmr.patch
    # fix CircuitTableIntPOD construction from int (no implicit constructor)
    - patches/circuittableint.patch
    # add missing #include <cstdint> and #include <atomic>
    - patches/missing_includes.patch
    # fix std::execution::seq/par unavailable on macOS libc++
    - patches/components.patch

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
    - gfan  # [build_platform != target_platform]
  host:
    - gmp
    - cddlib
  run:
    - gmp
    - cddlib

test:
  commands:
    - test -f ${PREFIX}/bin/gfan
    - gfan _version
    # Compute Groebner bases
    - echo 'Q[x,y,z]{x^2+y+z,x+y^2+z,x+y+z^2}' | gfan _bases | head -1
    # Compute a Groebner fan and check its f-vector
    - echo 'Q[a,b,c]{a^3+b^2c-a,c^2-2/3b}' | gfan _bases | gfan _topolyhedralfan | grep F_VECTOR
    # Compute a lattice ideal
    - echo '{(2,-1,0),(3,0,-1)}' | gfan _latticeideal | grep x0

about:
  home: http://home.math.au.dk/jensen/software/gfan/gfan.html
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Gfan is a software package for computing Gröbner fans and tropical varieties
  doc_url: http://home.math.au.dk/jensen/software/gfan/gfanmanual0.5.pdf

extra:
  recipe-maintainers:
    - isuruf
    - saraedum
